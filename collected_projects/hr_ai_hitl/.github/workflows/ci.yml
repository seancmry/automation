# PR / push quality gate — typecheck, eval fixture, build, container image.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Eval heuristics (golden fixture)
        run: npm run eval:check

      - name: Production build
        run: npm run build
        env:
          # Build must not require live API keys.
          ODOO_MODE: mock
          AI_PROVIDER: groq
          GROQ_API_KEY: ci-placeholder

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Build container image
        run: docker build -t hr-hitl-workbench:ci .
